name: Fetch map data

on:
  workflow_dispatch:
    inputs:
      what:
        description: What to fetch
        required: true
        default: gis
        type: choice
        options:
          - gis
          - state-roads
          - imagery
      scenario:
        description: Scenario id, for imagery
        required: false
        default: americus-400
        type: string
      branch:
        description: Branch to commit the data to
        required: false
        default: main
        type: string

concurrency:
  group: fetch-data
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  fetch:
    name: Fetch and commit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Rivers, streets, rail, power lines, parks and buildings
        if: inputs.what == 'gis'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin
          curl -fsSL -o georgia.osm.pbf https://download.geofabrik.de/north-america/us/georgia-latest.osm.pbf
          npm run build:gis -- --pbf georgia.osm.pbf
          rm georgia.osm.pbf
          npm run build:hexgrid

      - name: Statewide roads
        if: inputs.what == 'state-roads'
        run: npm run fetch:roads -- --state

      - name: Aerial imagery
        if: inputs.what == 'imagery'
        run: npm run fetch:imagery -- --scenario "${{ inputs.scenario }}"

      - run: npm run verify:data

      - name: Test against the new data
        run: |
          npm run typecheck
          npm test
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Commit and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A public/data
          if git diff --cached --quiet -- public/data; then
            echo "No change to the data."
            exit 0
          fi
          git diff --cached --stat -- public/data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update ${{ inputs.what }} map data"
          git push origin HEAD:"${{ inputs.branch }}"
          # A push made with the workflow token does not start other workflows.
          gh workflow run deploy.yml --ref "${{ inputs.branch }}"
